# Weekly dependency updates. GitHub Actions are grouped and their majors
# ignored (a new major is reviewed by hand); Python dependencies go in two
# groups, dev tooling (pytest, ruff) and runtime, majors included.
# Updates target develop, the integration branch; main only moves by release.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: uv
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
    # elpio's dev tools live in an optional extra, not a dependency group, so
    # Dependabot sees every Python dependency as production: split by name.
    # The first matching group wins.
    groups:
      python-dev:
        patterns: ["pytest*", "ruff"]
      python-runtime:
        patterns: ["*"]
